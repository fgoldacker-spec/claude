plugins {
    id 'com.android.application'
}

android {
    namespace 'de.goldacker.blockdoku'
    compileSdk 34

    defaultConfig {
        applicationId 'de.goldacker.blockdoku'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Wrap the shared game page into a full HTML document for the WebView.
def gameDir = layout.buildDirectory.dir('generated/game').get().asFile
def gameAsset = tasks.register('gameAsset') {
    def src = rootProject.file('../game/blockdoku.html')
    inputs.file src
    outputs.dir gameDir
    doLast {
        gameDir.mkdirs()
        new File(gameDir, 'index.html').text =
            '<!doctype html><html lang="de"><head><meta charset="utf-8">' +
            '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">' +
            '</head><body>\n' + src.text + '\n</body></html>\n'
    }
}
android.sourceSets.main.assets.srcDirs += gameDir
tasks.named('preBuild') { dependsOn gameAsset }
