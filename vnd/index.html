<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1d2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Dong</title>
<style>
:root{--bg:#0b1d2a;--card:#12303f;--key:#1a4256;--acc:#ffd23f;--tx:#f2f7fa;--mut:#8fb0c0}
@media(prefers-color-scheme:light){:root{--bg:#f3f7f9;--card:#fff;--key:#e1ecf1;--acc:#c8102e;--tx:#0b1d2a;--mut:#58727f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);max-width:480px;margin:auto}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;padding:10px 4px}
.disp{background:var(--card);border-radius:20px;padding:16px 20px;display:flex;flex-direction:column;gap:2px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.in{font-size:clamp(34px,11vw,52px);font-weight:600;overflow:hidden;white-space:nowrap}
.out{font-size:clamp(40px,14vw,64px);font-weight:800;color:var(--acc);overflow:hidden;white-space:nowrap}
.cur{font-size:18px;color:var(--mut);background:none;border:0;color:var(--mut);padding:4px 8px;border-radius:10px;font-weight:600}
.cur.t{background:var(--key);color:var(--tx)}
.swap{align-self:center;background:var(--key);color:var(--tx);border:0;border-radius:50%;width:38px;height:38px;font-size:20px;margin:-2px 0}
.chips{display:flex;gap:8px;margin:12px 0 8px;overflow-x:auto}
.chips button{flex:1;min-width:64px;background:var(--card);color:var(--tx);border:1px solid var(--key);border-radius:14px;padding:12px 4px;font-size:16px;font-weight:600}
.pad{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pad button{background:var(--key);color:var(--tx);border:0;border-radius:16px;font-size:28px;font-weight:600;min-height:56px}
.pad button:active,.chips button:active{filter:brightness(1.4)}
</style>
</head>
<body>
<div class="top"><span id="rate">…</span><span id="age"></span></div>
<div class="disp">
  <div class="row"><div class="in" id="in">0</div><button class="cur" id="cin">₫</button></div>
  <button class="swap" id="swap">⇅</button>
  <div class="row"><div class="out" id="out">0</div><button class="cur t" id="cout">€</button></div>
</div>
<div class="chips" id="chips"></div>
<div class="pad" id="pad"></div>
<script>
const SYM={VND:'₫',EUR:'€',USD:'$',CHF:'CHF'};
const FALLBACK={VND:30000,USD:1.08,CHF:0.94}; // Näherung pro 1 EUR, falls noch nie geladen
const TARGETS=['EUR','USD','CHF'];
let st={rates:Object.assign({EUR:1},FALLBACK),ts:0,target:'EUR',rev:false};
try{Object.assign(st,JSON.parse(localStorage.getItem('vnd')||'{}'))}catch(e){}
let s='',fresh=false;
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem('vnd',JSON.stringify(st))}catch(e){}};
// 1 Einheit Fremdwährung in VND
const perVnd=()=>st.rates[st.target]/st.rates.VND;
function fmt(n,cur){
  const d=cur==='VND'?0:2;
  return n.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function render(){
  const inCur=st.rev?st.target:'VND', outCur=st.rev?'VND':st.target;
  const v=parseFloat(s.replace(',','.'))||0;
  const out=st.rev?v/perVnd():v*perVnd();
  $('in').textContent=s?(inCur==='VND'?Number(s).toLocaleString('de-DE'):s.replace('.',',')):'0';
  $('out').textContent=fmt(out,outCur);
  $('cin').textContent=SYM[inCur];$('cout').textContent=SYM[outCur];
  $('cin').className='cur'+(st.rev?' t':'');$('cout').className='cur'+(st.rev?'':' t');
  const r=1/perVnd();
  $('rate').textContent='1 '+SYM[st.target]+' = '+fmt(r,'VND')+' ₫';
  const h=st.ts?Math.round((Date.now()-st.ts)/36e5):null;
  $('age').textContent=h===null?'Näherungswert':h<1?'aktuell':'vor '+h+' h';
  chips();
}
function chips(){
  const amts=st.rev?[5,10,20,50]:[50000,100000,200000,500000];
  $('chips').innerHTML=amts.map(a=>`<button data-a="${a}">${st.rev?a:a/1000+'k'}</button>`).join('')+'<button data-c="1">C</button>';
}
function key(k){
  if(fresh&&k!=='⌫'){s='';fresh=false}
  if(k==='⌫')s=s.slice(0,-1);
  else if(k===','){if(st.rev&&!s.includes('.'))s=(s||'0')+'.'}
  else if(s.length<(st.rev?9:12))s=(s==='0'?'':s)+k;
  render();
}
$('pad').innerHTML=['1','2','3','4','5','6','7','8','9',st.rev?',':'000','0','⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('');
function padRefresh(){$('pad').children[9].textContent=st.rev?',':'000';$('pad').children[9].dataset.k=st.rev?',':'000'}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.k)key(b.dataset.k);
  else if(b.dataset.a){s=b.dataset.a;fresh=true;render()}
  else if(b.dataset.c){s='';render()}
  else if(b.id==='swap'){st.rev=!st.rev;s='';padRefresh();save();render()}
  else if(b.id==='cout'&&!st.rev||b.id==='cin'&&st.rev){st.target=TARGETS[(TARGETS.indexOf(st.target)+1)%3];save();render()}
});
document.addEventListener('keydown',e=>{
  if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫');
  else if(e.key==='k'||e.key==='K')key('000');
});
async function load(){
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/EUR',{cache:'no-store'});
    const j=await r.json();
    if(j.rates&&j.rates.VND){st.rates={EUR:1,VND:j.rates.VND,USD:j.rates.USD,CHF:j.rates.CHF};st.ts=Date.now();save();render()}
  }catch(e){}
}
padRefresh();render();load();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
