<title>Blockdoku</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600&display=swap">
<style>
/* Layout: one-screen app — score bar, 9×9 sudoku board, tray of three pieces. Single dark "night slate" look. */
:root {
  --bg: #0e1430;
  --board: #19214d;
  --cell-a: #222c62;
  --cell-b: #161d45;
  --line: #3b4787;
  --block: #f4b740;
  --block-hi: #ffd57a;
  --block-lo: #c98a17;
  --ink: #e9ecff;
  --muted: #8f99c9;
  --good: #5fe3a4;
  --bad: #ff7a7a;
  --font-display: "Bungee", "Arial Black", system-ui, sans-serif;
  --font-body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
  gap: 14px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  --size: min(100vw - 32px, 100vh - 260px, 480px);
}
.bar { width: var(--size); display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: .04em; color: var(--block); }
.stat { display: flex; flex-direction: column; align-items: flex-end; }
.stat small { font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat.best b { font-size: 1rem; color: var(--muted); }
.stats { display: flex; gap: 18px; align-items: flex-end; }
.board-wrap { position: relative; }
.board {
  width: var(--size); height: var(--size); max-width: 100%;
  display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; padding: 4px; box-sizing: border-box;
  background: var(--board); border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .35);
}
.cell { border-radius: 3px; background: var(--cell-a); position: relative; }
.cell.alt { background: var(--cell-b); }
.cell.filled, .pc {
  background: linear-gradient(145deg, var(--block-hi), var(--block) 45%, var(--block-lo));
  box-shadow: inset 0 -2px 0 rgb(0 0 0 / .18);
}
.cell.ghost { background: color-mix(in srgb, var(--block) 45%, var(--cell-a)); }
.cell.willclear { outline: 2px solid var(--good); outline-offset: -2px; }
.cell.pop::after {
  content: ""; position: absolute; inset: 0; border-radius: 3px;
  background: var(--block-hi); animation: pop .38s ease-out forwards;
}
@keyframes pop { from { transform: scale(1); opacity: 1; } to { transform: scale(.2); opacity: 0; } }
.tray { width: var(--size); max-width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: 1; min-height: 120px; max-height: 170px; }
.slot { display: grid; place-items: center; border-radius: 12px; background: rgb(255 255 255 / .03); cursor: grab; }
.slot.dead .piece { opacity: .3; }
.piece { display: grid; gap: 2px; pointer-events: none; }
.piece .pc, .piece .pe { width: var(--pc, 20px); height: var(--pc, 20px); border-radius: 3px; }
.slot.dragging .piece { visibility: hidden; }
.float { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; display: grid; gap: 2px; filter: drop-shadow(0 8px 12px rgb(0 0 0 / .45)); }
.float .pc, .float .pe { border-radius: 3px; }
.toast {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
  font-family: var(--font-display); font-size: 1.7rem; color: var(--good); text-shadow: 0 3px 0 rgb(0 0 0 / .4);
  pointer-events: none; animation: rise 1s ease-out forwards; white-space: nowrap;
}
@keyframes rise { from { opacity: 0; transform: translate(-50%, -30%) scale(.8); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1); } to { opacity: 0; transform: translate(-50%, -110%); } }
.over {
  position: absolute; inset: 0; display: grid; place-items: center; border-radius: 10px;
  background: rgb(14 20 48 / .86); backdrop-filter: blur(2px);
}
.over-card { text-align: center; display: grid; gap: 10px; padding: 16px; }
.over h2 { margin: 0; font-family: var(--font-display); font-weight: 400; color: var(--block); font-size: 1.8rem; }
.over p { margin: 0; color: var(--muted); }
button {
  font: 600 1rem var(--font-body); color: var(--bg); background: var(--block); border: 0; border-radius: 999px;
  padding: 12px 26px; cursor: pointer; box-shadow: 0 4px 0 var(--block-lo);
}
button:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--block-lo); }
button:focus-visible, .slot:focus-visible { outline: 3px solid var(--good); outline-offset: 2px; }
.ghost-btn { background: transparent; color: var(--muted); box-shadow: none; padding: 6px 10px; font-size: .85rem; }
@media (prefers-reduced-motion: reduce) { .cell.pop::after, .toast { animation-duration: .01s; } }
</style>

<div class="app">
  <div class="bar">
    <div>
      <div class="brand">BLOCKDOKU</div>
      <button class="ghost-btn" id="restart" type="button">Neues Spiel</button>
    </div>
    <div class="stats">
      <div class="stat best"><small>Rekord</small><b id="best">0</b></div>
      <div class="stat"><small>Punkte</small><b id="score">0</b></div>
    </div>
  </div>
  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="over" id="over" hidden>
      <div class="over-card">
        <h2>Kein Platz mehr</h2>
        <p id="overText"></p>
        <div><button id="again" type="button">Nochmal spielen</button></div>
      </div>
    </div>
  </div>
  <div class="tray" id="tray"></div>
</div>

<script>
(() => {
  const N = 9;
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), trayEl = $('tray');

  // --- Pieces: base shapes, expanded to all distinct rotations/mirrors ---
  const BASE = [
    ['#'], ['##'], ['###'], ['####'], ['#####'],
    ['#.', '.#'], ['#..', '.#.', '..#'],
    ['##', '##'],
    ['#.', '##'], ['#.', '#.', '##'], ['###', '.#.'], ['##.', '.##'],
    ['#..', '#..', '###'], ['.#.', '###', '.#.'], ['###', '.#.', '.#.'], ['#.#', '###'],
  ];
  const norm = cells => {
    const mr = Math.min(...cells.map(p => p[0])), mc = Math.min(...cells.map(p => p[1]));
    return cells.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  };
  const SHAPES = [];
  for (const rows of BASE) {
    let cells = [];
    rows.forEach((row, r) => [...row].forEach((ch, c) => ch === '#' && cells.push([r, c])));
    const seen = new Set();
    for (let m = 0; m < 2; m++) {
      for (let k = 0; k < 4; k++) {
        const n = norm(cells), key = JSON.stringify(n);
        if (!seen.has(key)) { seen.add(key); SHAPES.push(n); }
        cells = cells.map(([r, c]) => [c, -r]);
      }
      cells = cells.map(([r, c]) => [r, -c]);
    }
  }
  const dims = s => [Math.max(...s.map(p => p[0])) + 1, Math.max(...s.map(p => p[1])) + 1];

  // --- State ---
  let board, tray, score, streak, over;
  let best = 0;
  try { best = +localStorage.getItem('blockdoku-best') || 0; } catch {}

  const fits = (s, r0, c0) => s.every(([r, c]) => {
    const R = r0 + r, C = c0 + c;
    return R >= 0 && R < N && C >= 0 && C < N && !board[R * N + C];
  });
  const canPlaceAnywhere = s => {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (fits(s, r, c)) return true;
    return false;
  };
  // Units (rows, columns, 3×3 boxes) that would be full with the extra cells filled.
  const fullUnits = extra => {
    const filled = i => board[i] || extra.has(i);
    const units = [];
    for (let i = 0; i < N; i++) {
      const row = [], col = [], box = [];
      for (let j = 0; j < N; j++) {
        row.push(i * N + j);
        col.push(j * N + i);
        box.push((Math.floor(i / 3) * 3 + Math.floor(j / 3)) * N + (i % 3) * 3 + (j % 3));
      }
      for (const u of [row, col, box]) if (u.every(filled)) units.push(u);
    }
    return units;
  };

  const randomShape = () => SHAPES[Math.floor(Math.random() * SHAPES.length)];
  function dealTray() {
    // Try a few times to deal a set where at least one piece still fits.
    let set;
    for (let t = 0; t < 12; t++) {
      set = [randomShape(), randomShape(), randomShape()];
      if (set.some(canPlaceAnywhere)) break;
    }
    tray = set;
  }

  function newGame() {
    board = Array(N * N).fill(0);
    score = 0; streak = 0; over = false;
    dealTray();
    render();
  }

  // --- Rendering ---
  const cells = [];
  for (let i = 0; i < N * N; i++) {
    const r = Math.floor(i / N), c = i % N, el = document.createElement('div');
    el.className = 'cell';
    if ((Math.floor(r / 3) + Math.floor(c / 3)) % 2) el.classList.add('alt');
    el.addEventListener('animationend', () => el.classList.remove('pop'));
    boardEl.appendChild(el); cells.push(el);
  }

  function pieceGrid(s, el, size) {
    const [h, w] = dims(s);
    el.innerHTML = '';
    el.style.gridTemplateColumns = `repeat(${w}, ${size}px)`;
    el.style.gridTemplateRows = `repeat(${h}, ${size}px)`;
    const set = new Set(s.map(([r, c]) => r * 10 + c));
    for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
      const d = document.createElement('div');
      d.className = set.has(r * 10 + c) ? 'pc' : 'pe';
      d.style.width = d.style.height = size + 'px';
      el.appendChild(d);
    }
  }

  function render() {
    cells.forEach((el, i) => {
      el.classList.toggle('filled', !!board[i]);
      el.classList.remove('ghost', 'willclear');
    });
    trayEl.innerHTML = '';
    const slotW = trayEl.clientWidth / 3 || 100;
    tray.forEach((s, i) => {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.i = i;
      if (s) {
        const [h, w] = dims(s);
        const size = Math.max(10, Math.min(22, Math.floor((slotW - 24) / Math.max(w, h, 3)) - 2));
        const p = document.createElement('div');
        p.className = 'piece';
        pieceGrid(s, p, size);
        slot.appendChild(p);
        if (!canPlaceAnywhere(s)) slot.classList.add('dead');
        slot.addEventListener('pointerdown', e => startDrag(e, i, slot));
      }
      trayEl.appendChild(slot);
    });
    $('score').textContent = score;
    $('best').textContent = best;
    $('over').hidden = !over;
    if (over) $('overText').textContent = `${score} Punkte` + (score >= best && score > 0 ? ' · neuer Rekord!' : '');
  }

  function toast(text) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = text;
    boardEl.parentElement.appendChild(t);
    t.addEventListener('animationend', () => t.remove());
  }

  // --- Drag & drop ---
  let drag = null;
  const geom = () => {
    const a = cells[0].getBoundingClientRect(), b = cells[1].getBoundingClientRect();
    return { x: a.left, y: a.top, step: b.left - a.left, size: a.width };
  };

  function startDrag(e, i, slot) {
    if (over || drag) return;
    e.preventDefault();
    const g = geom(), s = tray[i], [h, w] = dims(s);
    const fl = document.createElement('div');
    fl.className = 'float';
    pieceGrid(s, fl, g.size);
    fl.style.gap = (g.step - g.size) + 'px';
    document.body.appendChild(fl);
    slot.classList.add('dragging');
    // On touch, lift the piece above the finger so it stays visible.
    const lift = e.pointerType === 'mouse' ? 0 : g.step * 1.6;
    drag = { i, s, slot, fl, g, w: w * g.step, h: h * g.step, lift, target: null };
    moveDrag(e);
  }

  function moveDrag(e) {
    if (!drag) return;
    const { g, fl, w, h, lift, s } = drag;
    const left = e.clientX - w / 2, top = e.clientY - h / 2 - lift;
    fl.style.transform = `translate(${left}px, ${top}px)`;
    const c0 = Math.round((left - g.x) / g.step), r0 = Math.round((top - g.y) / g.step);
    const ok = fits(s, r0, c0);
    const key = ok ? r0 * N + c0 : null;
    if (key === drag.target) return;
    drag.target = key;
    cells.forEach(el => el.classList.remove('ghost', 'willclear'));
    if (!ok) return;
    const idx = new Set(s.map(([r, c]) => (r0 + r) * N + c0 + c));
    idx.forEach(k => cells[k].classList.add('ghost'));
    fullUnits(idx).flat().forEach(k => cells[k].classList.add('willclear'));
  }

  function endDrag() {
    if (!drag) return;
    const { i, s, fl, slot, target } = drag;
    fl.remove(); slot.classList.remove('dragging');
    drag = null;
    if (target === null) { render(); return; }
    place(i, s, Math.floor(target / N), target % N);
  }

  function place(i, s, r0, c0) {
    const idx = new Set(s.map(([r, c]) => (r0 + r) * N + c0 + c));
    idx.forEach(k => board[k] = 1);
    const units = fullUnits(new Set());
    let pts = s.length;
    const cleared = new Set(units.flat());
    if (units.length) {
      streak++;
      pts += 18 * units.length + (units.length > 1 ? 10 * units.length : 0) + (streak > 1 ? 10 * (streak - 1) : 0);
      cleared.forEach(k => board[k] = 0);
    } else {
      streak = 0;
    }
    score += pts;
    tray[i] = null;
    if (tray.every(t => !t)) dealTray();
    if (!tray.some(t => t && canPlaceAnywhere(t))) over = true;
    if (score > best) { best = score; try { localStorage.setItem('blockdoku-best', best); } catch {} }
    render();
    cleared.forEach(k => cells[k].classList.add('pop'));
    if (units.length) toast(`+${pts}` + (streak > 1 ? `  Combo ×${streak}` : ''));
  }

  addEventListener('pointermove', moveDrag);
  addEventListener('pointerup', endDrag);
  addEventListener('pointercancel', endDrag);
  addEventListener('resize', () => !drag && render());
  $('restart').addEventListener('click', newGame);
  $('again').addEventListener('click', newGame);

  // Keep a running game across live updates of the page.
  const start = data => {
    if (data && data.board) { ({ board, tray, score, streak, over } = data); render(); }
    else newGame();
  };
  window.claude?.hot?.snapshot?.(() => ({ board, tray, score, streak, over }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
