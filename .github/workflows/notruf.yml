name: Notruf APK

on:
  push:
    paths: ['notruf/**', '.github/workflows/notruf.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle -p notruf assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: notruf-apk
          path: notruf/app/build/outputs/apk/debug/app-debug.apk
